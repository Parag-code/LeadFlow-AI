
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadFlow AI | Connect With Us</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #172033;
            min-height: 100vh;
        }

        .navbar {
            background: #111c35;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 23px;
            font-weight: 700;
        }

        .brand span {
            color: #70a5ff;
        }

        .navbar small {
            color: #c5d0e5;
        }

        .container {
            max-width: 760px;
            margin: 55px auto;
            padding: 0 20px;
        }

        .intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .intro h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .intro p {
            color: #657087;
            line-height: 1.6;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 35px rgba(20, 35, 65, 0.07);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce2ec;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #3978e8;
            box-shadow: 0 0 0 3px rgba(57, 120, 232, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #2868df;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1c54bd;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 14px;
        }

        .success {
            display: block;
            background: #e9f8ef;
            color: #176b38;
        }

        .error {
            display: block;
            background: #fff0f0;
            color: #a52222;
        }

        .footer {
            text-align: center;
            color: #7b8495;
            font-size: 13px;
            padding: 25px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .form-card {
                padding: 22px;
            }

            .intro h1 {
                font-size: 26px;
            }

            .navbar {
                padding: 18px 5%;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="brand">LeadFlow <span>AI</span></div>
        <small>AI-Powered Lead Management</small>
    </nav>

    <main class="container">

        <section class="intro">
            <h1>Let's Discuss Your Business Needs</h1>
            <p>
                Tell us about your requirements. Our team will review
                your inquiry and get back to you.
            </p>
        </section>

        <section class="form-card">

            <form id="leadForm">

                <div class="form-grid">

                    <div class="field">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name"
                            placeholder="Your full name"
                            maxlength="100" required>
                    </div>

                    <div class="field">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email"
                            placeholder="you@example.com"
                            maxlength="254" required>
                    </div>

                    <div class="field">
                        <label for="company">Company Name *</label>
                        <input type="text" id="company"
                            placeholder="Your company"
                            maxlength="150" required>
                    </div>

                    <div class="field">
                        <label for="business_type">Business Type</label>
                        <select id="business_type">
                            <option value="">Select business type</option>
                            <option value="Startup">Startup</option>
                            <option value="Small Business">Small Business</option>
                            <option value="Enterprise">Enterprise</option>
                            <option value="Agency">Agency</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="field full">
                        <label for="requirement">What do you need? *</label>
                        <textarea id="requirement"
                            placeholder="Describe your project or business requirements..."
                            maxlength="3000" required></textarea>
                    </div>

                    <div class="field">
                        <label for="budget">Estimated Budget *</label>
                        <select id="budget" required>
                            <option value="">Select budget</option>
                            <option value="Below ₹50,000">Below ₹50,000</option>
                            <option value="₹50,000 - ₹2,00,000">₹50,000 - ₹2,00,000</option>
                            <option value="₹2,00,000 - ₹5,00,000">₹2,00,000 - ₹5,00,000</option>
                            <option value="Above ₹5,00,000">Above ₹5,00,000</option>
                            <option value="Not decided">Not decided</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="timeline">Expected Timeline *</label>
                        <select id="timeline" required>
                            <option value="">Select timeline</option>
                            <option value="Immediately">Immediately</option>
                            <option value="Within 1 month">Within 1 month</option>
                            <option value="1-3 months">1-3 months</option>
                            <option value="3-6 months">3-6 months</option>
                            <option value="Just exploring">Just exploring</option>
                        </select>
                    </div>

                    <div class="field full">
                        <label for="additional_details">
                            Additional Details (Optional)
                        </label>
                        <textarea id="additional_details"
                            placeholder="Anything else you would like us to know?"
                            maxlength="2000"></textarea>
                    </div>

                </div>

                <button type="submit" id="submitBtn">
                    Submit Inquiry
                </button>

                <div id="message" class="message"
                    role="status" aria-live="polite"></div>

            </form>

        </section>

    </main>

    <footer class="footer">
        © 2026 LeadFlow AI. All rights reserved.
    </footer>

    <script>
        
const form = document.getElementById("leadForm");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    submitBtn.disabled = true;
    submitBtn.textContent = "AI is analyzing your inquiry...";
    message.className = "message";
    message.textContent = "";

    const payload = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        company: document.getElementById("company").value.trim(),
        business_type: document.getElementById("business_type").value,
        requirement: document.getElementById("requirement").value.trim(),
        budget: document.getElementById("budget").value,
        timeline: document.getElementById("timeline").value,
        additional_details:
            document.getElementById("additional_details").value.trim()
    };

    try {

        const response = await fetch("/submit-lead", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok) {
            const detail = typeof result.detail === "string"
                ? result.detail
                : "Please check your information and try again.";

            throw new Error(detail);
        }

        // CASE 1: Missing information
        if (result.needs_follow_up === true) {

            if (!result.lead_id || !result.redirect_url) {
                throw new Error(
                    "Follow-up details could not be generated. Please contact support."
                );
            }

            message.textContent =
                "Your inquiry has been received. We need a few more details. Redirecting you to the follow-up form...";

            message.className = "message success";

            submitBtn.textContent = "Opening Follow-up Form...";

            // Preserve lead ID and redirect customer.
            window.location.assign(result.redirect_url);

            return;
        }

        // CASE 2: All required information available
        message.textContent =
            result.message ||
            "Your inquiry has been submitted successfully.";

        message.className = "message success";

        form.reset();

        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Inquiry";

    } catch (error) {

        message.textContent =
            error.message || "Something went wrong. Please try again.";

        message.className = "message error";

        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Inquiry";
    }
});

    </script>

</body>
</html>
